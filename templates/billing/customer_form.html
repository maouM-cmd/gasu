{% extends 'base.html' %}
{% block title %}{{ title }} - GASU{% endblock %}
{% block content %}
  <h1 class="h4 mb-3">{{ title }}</h1>
  <form method="post" class="row g-3">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
      <div class="col-12">
        <label class="form-label">{{ field.label }}</label>
        {{ field }}
        {% if field.help_text %}
          <div class="form-text">{{ field.help_text }}</div>
        {% endif %}
        {{ field.errors }}
      </div>
    {% endfor %}
    <div class="col-12">
      <button type="submit" class="btn btn-primary large-btn">保存</button>
      <a class="btn btn-secondary ms-2" href="{% url 'billing:customer_list' %}">戻る</a>
    </div>
  </form>
{% endblock %}
