<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>顧客一覧</title>
  </head>
  <body>
    <h1>顧客一覧</h1>
    <ul>
      {% for c in customers %}
      <li>{{ c.name }}</li>
      {% empty %}
      <li>顧客が登録されていません。</li>
      {% endfor %}
    </ul>
    <p><a href="{% url 'billing:meter_input' %}">検針入力</a> | <a href="{% url 'billing:invoice_list' %}">請求一覧</a></p>
  </body>
</html>
