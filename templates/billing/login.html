{% extends 'base.html' %}
{% block title %}ログイン - GASU{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card">
        <div class="card-body">
          <h2 class="card-title text-center mb-4">GASU ログイン</h2>
          <form method="post">
            {% csrf_token %}
            {% if form.non_field_errors %}
              <div class="alert alert-danger">{{ form.non_field_errors }}</div>
            {% endif %}
            <div class="mb-3">
              <label class="form-label">ユーザー名</label>
              {{ form.username }}
            </div>
            <div class="mb-3">
              <label class="form-label">パスワード</label>
              {{ form.password }}
            </div>
            <button type="submit" class="btn btn-primary w-100 large-btn">ログイン</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
