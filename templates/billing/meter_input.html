{% extends 'base.html' %}
{% block title %}検針入力 - GASU{% endblock %}
{% block content %}
  <h1 class="h4 mb-3">検針入力</h1>
  <form method="post" class="row g-3">
    {% csrf_token %}
    <div class="col-12 col-md-6">
      <label class="form-label">顧客</label>
      <select name="customer" class="form-select">
        {% for c in customers %}
        <option value="{{ c.id }}">{{ c.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-6 col-md-3">
      <label class="form-label">値</label>
      <input name="value" class="form-control" />
    </div>
    <div class="col-6 col-md-3">
      <label class="form-label">日付</label>
      <input name="date" type="date" class="form-control" />
    </div>
    <div class="col-12">
      <button type="submit" class="btn btn-success large-btn">登録</button>
      <a class="btn btn-secondary ms-2" href="{% url 'billing:customer_list' %}">顧客一覧へ</a>
    </div>
  </form>
{% endblock %}
