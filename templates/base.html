<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}GASU{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      /* 高齢者向け配慮: 大きめフォントと十分な行間 */
      body { font-size: 1.05rem; line-height: 1.6; }
      .large-btn { padding: 0.75rem 1.2rem; font-size: 1.05rem; }
      .container { max-width: 900px; }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
      <div class="container">
        <a class="navbar-brand" href="{% url 'billing:customer_list' %}">GASU</a>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="{% url 'billing:customer_list' %}">顧客一覧</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'billing:meter_input' %}">検針入力</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'billing:invoice_list' %}">請求一覧</a></li>
          </ul>
        </div>
      </div>
    </nav>
    <main class="container">
      {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
