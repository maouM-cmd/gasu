services:
  - type: web
    name: gasu-app
    runtime: python
    pythonVersion: 3.11
    buildCommand: |
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate
    startCommand: gunicorn web.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_SETTINGS_MODULE
        value: web.settings_prod
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,localhost,127.0.0.1"
      - key: DB_ENGINE
        value: postgresql

  - type: pserv
    name: gasu-db
    runtime: postgresql
    ipAllowList: []
    postgresDatabaseName: gasu_db
    postgresUsername: gasu_user
    postgresVersion: "14"
